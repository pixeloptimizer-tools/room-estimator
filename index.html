<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Room Estimator Pro — v0.2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0f1115;
    --panel-bg: #161921;
    --border: #2a2f3a;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --accent: #f59e0b;
    --accent-hover: #fbbf24;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
  body { display: flex; height: 100vh; overflow: hidden; background: var(--bg); color: var(--text); }
  
  #canvas-wrap { flex: 1; position: relative; cursor: grab; }
  #canvas-wrap:active { cursor: grabbing; }
  canvas { display: block; }
  
  #panel { 
    width: 360px; background: var(--panel-bg); padding: 24px; 
    overflow-y: auto; border-left: 1px solid var(--border); 
    display: flex; flex-direction: column; gap: 20px; z-index: 10;
    box-shadow: -10px 0 30px rgba(0,0,0,0.5);
  }
  
  .header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
  .header p { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  
  .control-group { display: flex; flex-direction: column; gap: 8px; }
  .control-group label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; color: var(--text-muted); }
  .control-group label span { color: var(--accent); font-weight: 600; }
  
  input[type=range] { 
    -webkit-appearance: none; width: 100%; background: transparent; 
  }
  input[type=range]::-webkit-slider-runnable-track { 
    height: 6px; background: var(--border); border-radius: 3px; 
  }
  input[type=range]::-webkit-slider-thumb { 
    -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; 
    background: var(--accent); cursor: pointer; margin-top: -6px; 
    box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); transition: transform 0.1s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }

  .toggles { display: flex; gap: 10px; margin-top: 5px; }
  .toggle-btn {
    flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--text-muted); font-weight: 600; font-size: 12px;
    cursor: pointer; transition: all 0.2s;
  }
  .toggle-btn.active { background: rgba(245, 158, 11, 0.15); border-color: var(--accent); color: var(--accent); }

  .stats-box { background: rgba(0,0,0,0.2); border-radius: 10px; padding: 16px; border: 1px solid var(--border); }
  .stat { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .stat:last-child { border-bottom: none; }
  .stat span:last-child { color: var(--accent); font-weight: 700; }

  .paywall { margin-top: auto; padding: 16px; background: rgba(245, 158, 11, 0.05); border: 1px dashed var(--accent); border-radius: 10px; text-align: center; }
  .paywall p { font-size: 12px; color: var(--text); margin-bottom: 12px; line-height: 1.5; }
  button.buy { 
    width: 100%; padding: 14px; background: var(--accent); color: #000; 
    border: none; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s;
  }
  button.buy:hover { background: var(--accent-hover); transform: translateY(-1px); }
  button.buy.unlocked { background: #10b981; color: white; }
  #pdf-status { font-size: 11px; color: var(--text-muted); margin-top: 10px; }
</style>
</head>
<body>

<div id="canvas-wrap"></div>

<div id="panel">
  <div class="header">
    <h1>Room Estimator</h1>
    <p>Interactive 3D Building Estimator v0.2</p>
  </div>

  <div class="control-group">
    <label>Length <span id="lenV">5.0 m</span></label>
    <input type="range" id="len" min="2.5" max="15" step="0.1" value="5" />
  </div>

  <div class="control-group">
    <label>Width <span id="widV">4.0 m</span></label>
    <input type="range" id="wid" min="2.5" max="12" step="0.1" value="4" />
  </div>

  <div class="control-group">
    <label>Wall Height <span id="hgtV">2.8 m</span></label>
    <input type="range" id="hgt" min="2.2" max="5.0" step="0.1" value="2.8" />
  </div>

  <div class="control-group">
    <label>Openings</label>
    <div class="toggles">
      <button class="toggle-btn active" id="toggleDoor">Door</button>
      <button class="toggle-btn active" id="toggleWin">Windows</button>
    </div>
  </div>

  <div class="control-group">
    <label>Roof Pitch <span id="pitV">25°</span></label>
    <input type="range" id="pit" min="10" max="45" step="1" value="25" />
  </div>

  <div class="stats-box">
    <div class="stat"><span>Blocks (9")</span><span id="blocks">—</span></div>
    <div class="stat"><span>Cement</span><span id="cement">—</span></div>
    <div class="stat"><span>Floor Tiles</span><span id="tiles">—</span></div>
    <div class="stat"><span>Paint (2 coats)</span><span id="paint">—</span></div>
  </div>

  <div class="paywall">
    <p>🔒 Unlock the full <strong>Bill of Quantities (BOQ)</strong>, Supervisor Checklist, and Artisan Agreement.</p>
    <button class="buy" id="buyBtn">Unlock for GHS 30</button>
    <div id="pdf-status"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- SCENE SETUP ----------
const wrap = document.getElementById('canvas-wrap');
const scene = new THREE.Scene();
// Add a subtle gradient background
scene.background = new THREE.Color(0x0f1115);
scene.fog = new THREE.Fog(0x0f1115, 20, 60);

const camera = new THREE.PerspectiveCamera(40, wrap.clientWidth / wrap.clientHeight, 0.1, 1000);
camera.position.set(10, 10, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(wrap.clientWidth, wrap.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrap.appendChild(renderer.domElement);

// ---------- CONTROLS (FIXED) ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxPolarAngle = Math.PI / 2 - 0.05; // Stay above ground
controls.minDistance = 3;
controls.maxDistance = 40;
controls.target.set(0, 1.4, 0);

// ---------- LIGHTING (PROFESSIONAL LOOK) ----------
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.left = -20;
dirLight.shadow.camera.right = 20;
dirLight.shadow.camera.top = 20;
dirLight.shadow.camera.bottom = -20;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
fillLight.position.set(-10, 5, -10);
scene.add(fillLight);

// ---------- ENVIRONMENT ----------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 100),
  new THREE.MeshStandardMaterial({ color: 0x1a1d24, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(100, 100, 0x2a2f3a, 0x161921);
scene.add(grid);

// ---------- PARAMETERS ----------
const P = { len: 5, wid: 4, hgt: 2.8, pitch: 25, hasDoor: true, hasWin: true };
const BLOCK_W = 0.45, BLOCK_H = 0.225, BLOCK_THICK = 0.225;
const OPENINGS = {
  door: { w: 0.9, h: 2.1 },
  window: { w: 1.2, h: 1.2, sillY: 1.0 }
};

const wallsGroup = new THREE.Group();
const roofGroup = new THREE.Group();
scene.add(wallsGroup, roofGroup);

// Materials
const blockMat = new THREE.MeshStandardMaterial({ 
  color: 0xd4cbb8, roughness: 0.9, metalness: 0.1 
});
const roofMat = new THREE.MeshStandardMaterial({ 
  color: 0x991b1b, roughness: 0.7, metalness: 0.2, side: THREE.DoubleSide 
});
const gableMat = new THREE.MeshStandardMaterial({ 
  color: 0xd4cbb8, roughness: 0.9, metalness: 0.1, side: THREE.DoubleSide 
});

// ---------- BUILD WALLS ----------
function buildWalls() {
  wallsGroup.clear();
  const { len, wid, hgt, hasDoor, hasWin } = P;
  const geo = new THREE.BoxGeometry(BLOCK_W * 0.98, BLOCK_H * 0.98, BLOCK_THICK);

  const walls = [
    { axis: 'x', fixed:  wid/2, span: len, door: hasDoor,  win: false },
    { axis: 'x', fixed: -wid/2, span: len, door: false,     win: false },
    { axis: 'z', fixed: -len/2, span: wid, door: false,     win: hasWin },
    { axis: 'z', fixed:  len/2, span: wid, door: false,     win: hasWin },
  ];

  walls.forEach(w => {
    const cols = Math.round(w.span / BLOCK_W);
    const rows = Math.round(hgt / BLOCK_H);

    for (let c = 0; c < cols; c++) {
      for (let r = 0; r < rows; r++) {
        const alongPos = c * BLOCK_W + BLOCK_W / 2 - w.span / 2;
        const yPos = r * BLOCK_H + BLOCK_H / 2;

        // Skip for Door
        if (w.door) {
          const { w: dw, h: dh } = OPENINGS.door;
          if (Math.abs(alongPos) < dw / 2 && yPos < dh) continue;
        }
        // Skip for Windows
        if (w.win) {
          const { w: ww, h: wh, sillY } = OPENINGS.window;
          // Cut two windows per wall
          if ((Math.abs(alongPos - w.span/4) < ww/2 || Math.abs(alongPos + w.span/4) < ww/2) 
              && yPos > sillY && yPos < sillY + wh) continue;
        }

        const m = new THREE.Mesh(geo, blockMat);
        m.castShadow = true;
        m.receiveShadow = true;
        
        if (w.axis === 'x') m.position.set(alongPos, yPos, w.fixed);
        else { 
          m.position.set(w.fixed, yPos, alongPos); 
          m.rotation.y = Math.PI / 2; 
        }
        wallsGroup.add(m);
      }
    }
  });
}

// ---------- BUILD PERFECT ROOF ----------
function buildRoof() {
  roofGroup.clear();
  const { len, wid, hgt, pitch } = P;
  const rad = (pitch * Math.PI) / 180;
  const halfW = wid / 2;
  const rise = Math.tan(rad) * halfW;
  const yBase = hgt;
  const overhang = 0.4; // Roof extends past walls

  // 1. Build the two slanted roof planes
  const slopeLen = Math.sqrt((halfW + overhang) * (halfW + overhang) + rise * rise);
  const roofLen = len + (overhang * 2);
  const roofGeo = new THREE.PlaneGeometry(roofLen, slopeLen);

  const frontSlope = new THREE.Mesh(roofGeo, roofMat);
  frontSlope.rotation.x = -rad;
  // Calculate exact positioning to sit on the wall edge
  frontSlope.position.set(0, yBase + rise/2 - Math.sin(rad)*overhang/2, (halfW + overhang)/2);
  frontSlope.castShadow = true;
  frontSlope.receiveShadow = true;
  roofGroup.add(frontSlope);

  const backSlope = new THREE.Mesh(roofGeo.clone(), roofMat);
  backSlope.rotation.x = rad;
  backSlope.position.set(0, yBase + rise/2 - Math.sin(rad)*overhang/2, -(halfW + overhang)/2);
  backSlope.castShadow = true;
  backSlope.receiveShadow = true;
  roofGroup.add(backSlope);

  // 2. Build the Gable Ends (the triangles)
  const triShape = new THREE.Shape();
  triShape.moveTo(-halfW, 0);
  triShape.lineTo(halfW, 0);
  triShape.lineTo(0, rise);
  triShape.lineTo(-halfW, 0);
  
  // Extrude the triangle slightly so it has thickness
  const extrudeSettings = { depth: 0.1, bevelEnabled: false };
  const triGeo = new THREE.ExtrudeGeometry(triShape, extrudeSettings);

  const gableFront = new THREE.Mesh(triGeo, gableMat);
  gableFront.position.set(0, yBase, len/2 - 0.05);
  gableFront.castShadow = true;
  roofGroup.add(gableFront);

  const gableBack = new THREE.Mesh(triGeo, gableMat);
  gableBack.position.set(0, yBase, -len/2 - 0.05);
  gableBack.castShadow = true;
  roofGroup.add(gableBack);
}

// ---------- CAMERA AUTO-FIT ----------
function autoFitCamera() {
  const maxDim = Math.max(P.len, P.wid, P.hgt);
  const dist = maxDim * 2.2;
  // Only zoom out if the user hasn't manually zoomed yet
  if (camera.position.length() < dist - 2) {
    camera.position.set(dist * 0.8, dist * 0.7, dist * 0.9);
    controls.target.set(0, P.hgt / 2, 0);
  }
}

// ---------- ESTIMATION MATH ----------
function calcEstimates() {
  const { len, wid, hgt, hasDoor, hasWin } = P;
  
  let doorArea = 0;
  if (hasDoor) doorArea = OPENINGS.door.w * OPENINGS.door.h;
  
  let winArea = 0;
  if (hasWin) winArea = 2 * OPENINGS.window.w * OPENINGS.window.h; // 2 windows total

  const grossWallArea = 2 * (len + wid) * hgt;
  const netWallArea = grossWallArea - doorArea - winArea;

  const blocks = Math.ceil(netWallArea * 12 * 1.05);
  const cement = Math.ceil((netWallArea * 0.5 + netWallArea * 0.3 * 2) * 1.10);
  const floorArea = len * wid;
  const tiles = Math.ceil((floorArea / 0.09) * 1.10);
  const paintLitres = Math.ceil((netWallArea / 5) * 1.05);

  return { blocks, cement, tiles, paintLitres, netWallArea, floorArea };
}

// ---------- UI WIRING ----------
const fmt = (n, u) => `${n.toLocaleString()} ${u}`;

function update() {
  document.getElementById('lenV').textContent = P.len.toFixed(1) + ' m';
  document.getElementById('widV').textContent = P.wid.toFixed(1) + ' m';
  document.getElementById('hgtV').textContent = P.hgt.toFixed(1) + ' m';
  document.getElementById('pitV').textContent = P.pitch + '°';

  buildWalls();
  buildRoof();
  autoFitCamera();

  const e = calcEstimates();
  document.getElementById('blocks').textContent = fmt(e.blocks, 'pcs');
  document.getElementById('cement').textContent = fmt(e.cement, 'bags');
  document.getElementById('tiles').textContent = fmt(e.tiles, 'pcs');
  document.getElementById('paint').textContent = fmt(e.paintLitres, 'L');

  window.__lastEstimate = e;
}

document.getElementById('len').oninput = e => { P.len = +e.target.value; update(); };
document.getElementById('wid').oninput = e => { P.wid = +e.target.value; update(); };
document.getElementById('hgt').oninput = e => { P.hgt = +e.target.value; update(); };
document.getElementById('pit').oninput = e => { P.pitch = +e.target.value; update(); };

// Toggles
document.getElementById('toggleDoor').onclick = (e) => {
  P.hasDoor = !P.hasDoor;
  e.target.classList.toggle('active', P.hasDoor);
  update();
};
document.getElementById('toggleWin').onclick = (e) => {
  P.hasWin = !P.hasWin;
  e.target.classList.toggle('active', P.hasWin);
  update();
};

// ---------- MOCK PAYMENT + PDF ----------
document.getElementById('buyBtn').onclick = () => {
  const btn = document.getElementById('buyBtn');
  btn.textContent = 'Processing…';
  btn.disabled = true;

  setTimeout(() => {
    btn.textContent = '✓ Download BOQ PDF';
    btn.classList.add('unlocked');
    btn.disabled = false;
    btn.onclick = downloadPDF;
    document.getElementById('pdf-status').textContent = 'Payment successful (Mock).';
  }, 800);
};

function downloadPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const e = window.__lastEstimate;
  const today = new Date().toLocaleDateString('en-GB');
  const ref = 'RE-' + Date.now().toString(36).toUpperCase();

  doc.setFillColor(245, 158, 11);
  doc.rect(0, 0, 210, 22, 'F');
  doc.setTextColor(0, 0, 0);
  doc.setFontSize(16); doc.setFont(undefined, 'bold');
  doc.text('BUILDER\'S PROTECTION PACKET', 14, 14);

  doc.setFontSize(10); doc.setFont(undefined, 'normal');
  doc.text(`Ref: ${ref}   |   Date: ${today}   |   Watermark: sample@buyer.com`, 14, 32);

  doc.setFontSize(13); doc.setFont(undefined, 'bold');
  doc.text('1. Bill of Quantities', 14, 44);

  doc.setFontSize(10); doc.setFont(undefined, 'normal');
  const rows = [
    ['Room length', `${P.len.toFixed(1)} m`],
    ['Room width', `${P.wid.toFixed(1)} m`],
    ['Wall height', `${P.hgt.toFixed(1)} m`],
    ['Net wall area', `${e.netWallArea.toFixed(1)} m²`],
    ['Floor area', `${e.floorArea.toFixed(1)} m²`],
    ['Sandcrete blocks (9")', `${e.blocks} pcs`],
    ['Cement', `${e.cement} bags`],
    ['Floor tiles (300x300mm)', `${e.tiles} pcs`],
    ['Paint (2 coats)', `${e.paintLitres} L`],
  ];
  let y = 54;
  rows.forEach(([k, v]) => {
    doc.text(k, 18, y);
    doc.text(v, 120, y);
    y += 7;
  });

  y += 6;
  doc.setFont(undefined, 'bold');
  doc.text('2. Site Supervisor\'s Audit Checklist', 14, y); y += 7;
  doc.setFont(undefined, 'normal');
  const checklist = [
    '- Verify block count on delivery against the BOQ above.',
    '- Confirm 1 bag of cement yields ~25-30 blocks during laying.',
    '- Measure plaster thickness; reject work above 15mm.',
    '- Photograph tile boxes before and after installation.',
  ];
  checklist.forEach(t => { doc.text(t, 18, y); y += 6; });

  y += 6;
  doc.setFont(undefined, 'bold');
  doc.text('3. Standard Artisan Work Agreement', 14, y); y += 7;
  doc.setFont(undefined, 'normal');
  const contract = [
    'The artisan agrees to deliver the structure within the agreed timeline.',
    'Wages are payable per milestones defined below and signed by both parties.',
    'Material wastage beyond 10% is the artisan\'s financial responsibility.',
    'Disputes are resolved through the local trade association before litigation.',
    '',
    'Artisan signature: ______________________   Date: ____________',
    'Owner signature:   ______________________   Date: ____________',
  ];
  contract.forEach(t => { doc.text(t, 18, y); y += 6; });

  doc.setFontSize(8);
  doc.setTextColor(120, 120, 120);
  doc.text('Generated by Room Estimator v0.2 — sample build for validation only.', 14, 285);

  doc.save(`BOQ-${ref}.pdf`);
}

// ---------- RESIZE & ANIMATE ----------
new ResizeObserver(() => {
  camera.aspect = wrap.clientWidth / wrap.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
}).observe(wrap);

update();
(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
